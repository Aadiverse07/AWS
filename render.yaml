services:
  - type: web
    name: arnova-decider
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/dashboard.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: COST_MODE
        value: free
      - key: ALLOW_PAID
        value: "false"
