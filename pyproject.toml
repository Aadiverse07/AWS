[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-decider"
version = "0.1.0"
description = "A decision-first agent runtime for Jarvis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dashboard = ["streamlit>=1.40,<2"]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[project.scripts]
jarvis-decider = "jarvis.cli:main"
